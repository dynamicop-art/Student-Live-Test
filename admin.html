<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Exam Suite — Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<div class="wrap">

  <div class="hero" id="hero">
    <div class="top-actions"><button id="themeBtn" class="icon-btn" title="Dark/Light">🌙</button></div>
    <span class="pill" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35)">TEACHER DASHBOARD</span>
    <h1 id="heroName">Hi 👋</h1>
    <p id="heroMeta" class="muted" style="color:rgba(255,255,255,.85)"></p>
    <button id="logoutBtn" class="secondary" style="background:rgba(255,255,255,.9);color:#3a2a7a;margin-top:6px">Logout</button>
  </div>

  <div class="nav">
    <button id="tabCreateBtn" class="active">➕ নতুন Test</button>
    <button id="tabManageBtn">🗂️ Test List</button>
    <button id="tabGradeBtn">✅ Grading</button>
  </div>

  <!-- ================= CREATE TEST ================= -->
  <section id="paneCreate">
    <div class="card">
      <h2>➕ নতুন Test বানাও</h2>
      <input id="testTitle" placeholder="Test title (যেমন: রসায়ন একক ১ - পরীক্ষা ১)">
      <div style="height:10px"></div>
      <div class="row">
        <input id="testClassId" placeholder="Class ID (যেমন: class-x)">
        <input id="testSubject" placeholder="Subject (যেমন: Chemistry)">
      </div>
      <div style="height:10px"></div>
      <input id="testDuration" type="number" min="1" value="30" placeholder="Duration (মিনিট)">
      <div style="height:16px"></div>
      <h3>প্রশ্নসমূহ</h3>
      <div id="qList"></div>
      <button id="addQBtn" class="secondary" type="button">➕ প্রশ্ন যোগ করো</button>
      <div style="height:16px"></div>
      <button id="publishBtn" class="gold-btn" style="width:100%">🚀 Publish করো</button>
      <p id="createMsg" class="muted" style="margin-top:10px"></p>
    </div>
  </section>

  <!-- ================= MANAGE TESTS ================= -->
  <section id="paneManage" class="hidden">
    <div class="card"><h2>🗂️ সব Test</h2><div id="manageList"><p class="muted">Loading...</p></div></div>
  </section>

  <!-- ================= GRADING ================= -->
  <section id="paneGrade" class="hidden">
    <div class="card">
      <h2>✅ Submissions &amp; Grading</h2>
      <p class="muted">এই page খোলা থাকলে নতুন submit হওয়া answer গুলো auto-grade হবে।</p>
      <div id="gradeList"><p class="muted">Loading...</p></div>
    </div>
  </section>

</div>

<!-- ================= CONFIRM MODAL ================= -->
<div id="confirmOverlay" class="modal-overlay hidden">
  <div class="modal confirm-modal">
    <p id="confirmMsg" class="confirm-msg"></p>
    <div class="modal-actions">
      <button id="confirmYes" type="button">✅ হ্যাঁ</button>
      <button id="confirmNo" class="secondary" type="button">✖ না</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, deleteDoc, collection, getDocs, query, where, addDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { firebaseConfig } from "./config.js";
import { mountBlobs, toast } from "./effects.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? "" : s).replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

let profile = null, myTests = [], qCount = 0;
let testsUnsub = null, gradeUnsub = null;

function showFatalError(msg) {
  let bar = document.getElementById("fatalErrBar");
  if (!bar) { bar = document.createElement("div"); bar.id = "fatalErrBar"; bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#e11d48;color:#fff;padding:10px 14px;font-size:12.5px;text-align:center"; document.body.prepend(bar); }
  bar.textContent = "⚠️ Technical error: " + msg;
}
window.addEventListener("error", e => { console.error(e.error || e.message); showFatalError(e.message || "unknown error"); });
window.addEventListener("unhandledrejection", e => { console.error(e.reason); showFatalError((e.reason && e.reason.message) || "unknown async error"); });

function showConfirm(message) {
  return new Promise(resolve => {
    $("confirmMsg").textContent = message;
    $("confirmOverlay").classList.remove("hidden");
    const cleanup = r => { $("confirmOverlay").classList.add("hidden"); $("confirmYes").onclick = null; $("confirmNo").onclick = null; resolve(r); };
    $("confirmYes").onclick = () => cleanup(true);
    $("confirmNo").onclick = () => cleanup(false);
  });
}
function notify(msg, icon) { toast(msg, icon || "⚠️"); }

mountBlobs();
$("themeBtn").onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("theme", dark ? "light" : "dark"); } catch (e) {}
};
$("logoutBtn").onclick = async () => { if (await showConfirm("Logout করতে চাও?")) { await signOut(auth); location.href = "index.html"; } };

function showTab(name) {
  $("paneCreate").classList.toggle("hidden", name !== "create");
  $("paneManage").classList.toggle("hidden", name !== "manage");
  $("paneGrade").classList.toggle("hidden", name !== "grade");
  $("tabCreateBtn").classList.toggle("active", name === "create");
  $("tabManageBtn").classList.toggle("active", name === "manage");
  $("tabGradeBtn").classList.toggle("active", name === "grade");
}
$("tabCreateBtn").onclick = () => showTab("create");
$("tabManageBtn").onclick = () => showTab("manage");
$("tabGradeBtn").onclick = () => showTab("grade");

/* ================= AUTH ================= */
onAuthStateChanged(auth, async u => {
  if (!u) { location.href = "index.html"; return; }
  const p = await getDoc(doc(db, "users", u.uid));
  if (!p.exists() || p.data().role !== "teacher") { await signOut(auth); location.href = "index.html"; return; }
  profile = p.data();
  $("heroName").textContent = `Hi, ${esc(profile.name)} 👋`;
  $("heroMeta").textContent = profile.email;
  $("testClassId").value = profile.classId || "";
  addQuestionRow();
  loadTests();
  listenGrading();
});

/* ================= CREATE TEST ================= */
function addQuestionRow() {
  const idx = qCount++;
  const row = document.createElement("div");
  row.className = "qcard";
  row.dataset.idx = idx;
  row.innerHTML = `
    <div class="row" style="align-items:center"><b>প্রশ্ন ${idx + 1}</b><button type="button" class="secondary removeQBtn" style="max-width:90px">🗑️ মুছো</button></div>
    <textarea class="qText" placeholder="প্রশ্ন লেখো" style="min-height:60px"></textarea>
    <div style="height:8px"></div>
    <input class="qOptA" placeholder="Option A">
    <div style="height:6px"></div>
    <input class="qOptB" placeholder="Option B">
    <div style="height:6px"></div>
    <input class="qOptC" placeholder="Option C">
    <div style="height:6px"></div>
    <input class="qOptD" placeholder="Option D">
    <div style="height:8px"></div>
    <div class="row">
      <select class="qAnswer"><option value="0">সঠিক উত্তর: A</option><option value="1">সঠিক উত্তর: B</option><option value="2">সঠিক উত্তর: C</option><option value="3">সঠিক উত্তর: D</option></select>
      <input class="qTopic" placeholder="Topic (optional, review-এ দেখাবে)">
    </div>`;
  row.querySelector(".removeQBtn").onclick = () => row.remove();
  $("qList").appendChild(row);
}
$("addQBtn").onclick = addQuestionRow;

$("publishBtn").onclick = async () => {
  const title = $("testTitle").value.trim(), classId = $("testClassId").value.trim(), subjectName = $("testSubject").value.trim();
  const durationMinutes = Number($("testDuration").value) || 30;
  if (!title || !classId) { notify("Title আর Class ID দাও।"); return; }
  const rows = [...$("qList").querySelectorAll(".qcard")];
  if (!rows.length) { notify("কমপক্ষে একটা প্রশ্ন যোগ করো।"); return; }
  const questions = [], answers = [];
  for (const row of rows) {
    const q = row.querySelector(".qText").value.trim();
    const o = [row.querySelector(".qOptA").value.trim(), row.querySelector(".qOptB").value.trim(), row.querySelector(".qOptC").value.trim(), row.querySelector(".qOptD").value.trim()];
    const topic = row.querySelector(".qTopic").value.trim();
    const ans = Number(row.querySelector(".qAnswer").value);
    if (!q || o.some(x => !x)) { notify("সব প্রশ্ন আর ৪টা option পূরণ করো।"); return; }
    questions.push({ q, o, topic }); answers.push(ans);
  }
  $("publishBtn").disabled = true; $("createMsg").textContent = "Publish হচ্ছে...";
  try {
    const ref = await addDoc(collection(db, "tests"), { title, classId, subjectName, durationMinutes, published: true, questionCount: questions.length, questions, createdAt: serverTimestamp() });
    await setDoc(doc(db, "answerKeys", ref.id), { answers });
    $("createMsg").textContent = "✅ Publish হয়ে গেছে!";
    notify("Test publish হয়ে গেছে!", "🎉");
    $("testTitle").value = ""; $("qList").innerHTML = ""; qCount = 0; addQuestionRow();
    loadTests();
  } catch (err) {
    console.error("publish failed", err);
    $("createMsg").textContent = "❌ Publish হয়নি: " + (err.message || "আবার চেষ্টা করো।");
  } finally { $("publishBtn").disabled = false; }
};

/* ================= MANAGE TESTS ================= */
function loadTests() {
  testsUnsub = onSnapshot(collection(db, "tests"), snap => {
    myTests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderManage();
  }, err => console.error("tests listener error:", err));
}
function renderManage() {
  if (!myTests.length) { $("manageList").innerHTML = "<p class='muted'>এখনো কোনো test নেই।</p>"; return; }
  $("manageList").innerHTML = myTests.map(t => `<div class="test-item"><b>${esc(t.title)}</b><br><span class="muted">${esc(t.classId)} · ${(t.questions || []).length} questions</span><div class="row" style="margin-top:8px"><button class="secondary toggleBtn" data-id="${esc(t.id)}">${t.published ? "⏸️ Unpublish" : "▶️ Publish"}</button><button class="danger-btn deleteBtn" data-id="${esc(t.id)}">🗑️ Delete</button></div></div>`).join("");
  document.querySelectorAll(".toggleBtn").forEach(b => b.onclick = async () => {
    const t = myTests.find(x => x.id === b.dataset.id);
    await updateDoc(doc(db, "tests", t.id), { published: !t.published });
    notify(t.published ? "Unpublished করা হয়েছে" : "Published করা হয়েছে", "✅");
  });
  document.querySelectorAll(".deleteBtn").forEach(b => b.onclick = async () => {
    if (!(await showConfirm("এই test permanently delete করতে চাও? এটা undo করা যাবে না।"))) return;
    try { await deleteDoc(doc(db, "tests", b.dataset.id)); notify("Delete হয়ে গেছে", "🗑️"); }
    catch (err) { console.error(err); notify("Delete হয়নি — আবার চেষ্টা করো।"); }
  });
}

/* ================= GRADING (auto-grades pending submissions,
   builds a per-question correct/wrong `review` array for the student) ================= */
function listenGrading() {
  gradeUnsub = onSnapshot(collection(db, "attempts"), async snap => {
    const latest = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderGradeList(latest);
    for (const a of latest) {
      if (a.status === "submitted" && a.score == null) {
        try {
          const key = await getDoc(doc(db, "answerKeys", a.testId));
          const testDoc = await getDoc(doc(db, "tests", a.testId));
          if (!key.exists()) continue;
          const ans = key.data().answers;
          let score = 0; const topicStats = {}; const review = [];
          const qs = testDoc.exists() ? (testDoc.data().questions || []) : [];
          for (let i = 0; i < ans.length; i++) {
            const chosenRaw = a.answers ? a.answers["q" + i] : null;
            const chosenIdx = chosenRaw == null ? null : Number(chosenRaw);
            const correctIdx = Number(ans[i]);
            const correct = chosenIdx === correctIdx;
            if (correct) score++;
            const topic = (qs[i] && qs[i].topic) || "General";
            if (!topicStats[topic]) topicStats[topic] = { correct: 0, total: 0 };
            topicStats[topic].total++; if (correct) topicStats[topic].correct++;
            review.push({ q: (qs[i] && qs[i].q) || "", o: (qs[i] && qs[i].o) || [], topic, chosenIdx, correctIdx, isCorrect: correct });
          }
          await updateDoc(doc(db, "attempts", a.id), { score, total: ans.length, percentage: Math.round(score / ans.length * 100), topicStats, review, gradedAt: serverTimestamp() });
        } catch (err) { console.error("grading failed for", a.id, err); }
      }
    }
  }, err => console.error("grading listener error:", err));
}
function renderGradeList(attempts) {
  const submitted = attempts.filter(a => a.status === "submitted").sort((a, b) => (b.submittedAt?.seconds || 0) - (a.submittedAt?.seconds || 0)).slice(0, 40);
  if (!submitted.length) { $("gradeList").innerHTML = "<p class='muted'>এখনো কোনো submission নেই।</p>"; return; }
  $("gradeList").innerHTML = submitted.map(a => `<div class="test-item"><b>${esc(a.studentName)}</b> — ${esc(a.testTitle)}<br><span class="muted">${a.score != null ? `✅ Graded: ${a.score}/${a.total} (${a.percentage}%)` : "⏳ Grading হচ্ছে..."}</span></div>`).join("");
}
</script>
</body>
</html>
