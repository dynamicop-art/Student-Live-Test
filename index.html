<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Exam Suite — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap" style="max-width:420px;margin-top:6vh">
  <div class="hero" style="text-align:center">
    <div style="font-size:40px">🎓</div>
    <h1>Exam Suite</h1>
    <p>Exam দাও, তাৎক্ষণিক result দেখো, নিজেকে ছাড়িয়ে যাও।</p>
  </div>

  <div class="card">
    <div class="nav" style="margin-top:0">
      <button id="tabLogin" class="active">Login</button>
      <button id="tabSignup">Sign Up</button>
    </div>

    <div id="loginPane" style="margin-top:16px">
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
      <div style="height:10px"></div>
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
      <div style="height:14px"></div>
      <button id="loginBtn" style="width:100%">Login করো</button>
      <p id="loginMsg" class="muted" style="margin-top:10px"></p>
    </div>

    <div id="signupPane" class="hidden" style="margin-top:16px">
      <input id="suName" type="text" placeholder="তোমার নাম">
      <div style="height:10px"></div>
      <input id="suEmail" type="email" placeholder="Email" autocomplete="email">
      <div style="height:10px"></div>
      <input id="suPass" type="password" placeholder="Password (কমপক্ষে ৬ অক্ষর)" autocomplete="new-password">
      <div style="height:10px"></div>
      <input id="suClass" type="text" placeholder="Class (যেমন: Class X)">
      <div style="height:10px"></div>
      <select id="suRole">
        <option value="student">আমি একজন Student</option>
        <option value="teacher">আমি একজন Teacher</option>
      </select>
      <div style="height:14px"></div>
      <button id="signupBtn" style="width:100%">Account বানাও</button>
      <p id="signupMsg" class="muted" style="margin-top:10px"></p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);

$("tabLogin").onclick = () => { $("tabLogin").classList.add("active"); $("tabSignup").classList.remove("active"); $("loginPane").classList.remove("hidden"); $("signupPane").classList.add("hidden"); };
$("tabSignup").onclick = () => { $("tabSignup").classList.add("active"); $("tabLogin").classList.remove("active"); $("signupPane").classList.remove("hidden"); $("loginPane").classList.add("hidden"); };

async function routeByRole(uid) {
  const p = await getDoc(doc(db, "users", uid));
  if (!p.exists()) { $("loginMsg").textContent = "⚠️ Profile পাওয়া যায়নি।"; return; }
  location.href = p.data().role === "teacher" ? "admin.html" : "student.html";
}

$("loginBtn").onclick = async () => {
  const email = $("loginEmail").value.trim(), pass = $("loginPass").value;
  if (!email || !pass) { $("loginMsg").textContent = "Email আর password দাও।"; return; }
  $("loginBtn").disabled = true; $("loginMsg").textContent = "Login হচ্ছে...";
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    await routeByRole(cred.user.uid);
  } catch (e) {
    $("loginMsg").textContent = "❌ Login fail হয়েছে: " + (e.message || "Email/password check করো।");
  } finally { $("loginBtn").disabled = false; }
};

$("signupBtn").onclick = async () => {
  const name = $("suName").value.trim(), email = $("suEmail").value.trim(), pass = $("suPass").value;
  const className = $("suClass").value.trim(), role = $("suRole").value;
  if (!name || !email || !pass || !className) { $("signupMsg").textContent = "সব field পূরণ করো।"; return; }
  if (pass.length < 6) { $("signupMsg").textContent = "Password কমপক্ষে ৬ অক্ষর হতে হবে।"; return; }
  $("signupBtn").disabled = true; $("signupMsg").textContent = "Account বানানো হচ্ছে...";
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const classId = className.toLowerCase().replace(/\s+/g, "-");
    await setDoc(doc(db, "users", cred.user.uid), {
      uid: cred.user.uid, name, email, role, classId, className, createdAt: serverTimestamp()
    });
    location.href = role === "teacher" ? "admin.html" : "student.html";
  } catch (e) {
    $("signupMsg").textContent = "❌ Account বানানো যায়নি: " + (e.message || "আবার চেষ্টা করো।");
  } finally { $("signupBtn").disabled = false; }
};

onAuthStateChanged(auth, u => { if (u) routeByRole(u.uid); });
</script>
</body>
</html>
